version: 2
updates:
  # Keep the workflow actions current; they are the cheapest upgrades to verify.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Rust crates: monthly, grouped, so minor bumps arrive in one reviewable PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      crates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Android libraries; major AGP/Kotlin bumps stay manual.
  - package-ecosystem: gradle
    directory: /crates/bamdad-app/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
