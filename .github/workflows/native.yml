name: App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  XRAY_VERSION: "26.11.9"
  SINGBOX_VERSION: "1.14.4"

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: native-test
      - name: Install Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libgl1-mesa-dev
      - name: Test core
        run: cargo test -p bamdad-core
      - name: Check workspace
        run: cargo check --workspace

  desktop:
    name: Desktop (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-latest
            artifact: macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: native-desktop-${{ matrix.artifact }}
      - name: Install Slint build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libfontconfig1-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libgl1-mesa-dev
      - name: Build app
        run: cargo build -p bamdad-app --release
      - name: Package app with cores
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p package/bin dist
          ext=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then ext=".exe"; fi
          cp "target/release/bamdad${ext}" "package/bamdad${ext}"
          BAMDAD_CORE_DIR="$PWD/package" ./scripts/fetch-xray.sh
          BAMDAD_CORE_DIR="$PWD/package" ./scripts/fetch-singbox.sh
          # The app looks for geo assets next to the bundled cores.
          if [ -d package/assets ]; then
            mkdir -p package/bin/assets
            cp -a package/assets/. package/bin/assets/
            rm -rf package/assets
          fi
          chmod +x package/bamdad 2>/dev/null || true
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./package/bamdad.exe --version
            powershell -NoProfile -Command "Compress-Archive -Force -Path 'package/*' -DestinationPath 'dist/bamdad-${version}-${{ matrix.artifact }}.zip'"
          else
            ./package/bamdad --version
            tar -czf "dist/bamdad-${version}-${{ matrix.artifact }}.tar.gz" -C package .
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: bamdad-${{ matrix.artifact }}
          path: dist/

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: strongswan
    steps:
      - uses: actions/checkout@v7
      - name: Check out native dependencies
        run: |
          git submodule update --init --recursive --depth 1 \
            crates/bamdad-app/android/vendor/amneziawg-android \
            crates/bamdad-app/android/vendor/openvpn3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: native-android-debug
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - uses: cargo-bins/cargo-binstall@v1.17.5
        env:
          BINSTALL_VERSION: "1.17.5"
      - name: Install cargo-ndk
        run: cargo binstall --no-confirm cargo-ndk@4.1.2 || cargo install cargo-ndk --version 4.1.2 --locked
      - uses: actions/cache@v6
        with:
          path: |
            crates/bamdad-app/android/openvpn3-tunnel/deps
            .native-deps/openvpn3/cache
          key: openvpn3-deps-${{ hashFiles('scripts/build-openvpn3-deps.sh', 'crates/bamdad-app/android/vendor/openvpn3/deps/lib-versions') }}
      - name: Build OpenVPN 3 dependencies
        run: ./scripts/build-openvpn3-deps.sh x86_64
      - name: Build x86_64 native libraries
        run: ./crates/bamdad-app/android/build-native.sh x86_64
      - name: Build Android network checker
        run: ./scripts/build-android-netcheck.sh "$PWD/netcheck"
      - name: Download the strongSwan libraries
        uses: actions/download-artifact@v7
        with:
          name: bamdad-strongswan-android
          path: crates/bamdad-app/android/app/src/main/jniLibs
      - name: Build debug APK
        env:
          # setup-go exports GOTOOLCHAIN=local via GITHUB_ENV; the vendored
          # amneziawg Makefile pins Go 1.24.2 while go.mod needs 1.24.4.
          GOTOOLCHAIN: auto
        run: gradle -p crates/bamdad-app/android --no-daemon -PbamdadAbis=x86_64 assembleX86_64Debug
      - name: Inspect APK
        run: |
          find crates/bamdad-app/android/app/build/outputs/apk/x86_64/debug -type f | sort
          unzip -l crates/bamdad-app/android/app/build/outputs/apk/x86_64/debug/app-x86_64-debug.apk | grep 'lib/'
          for lib in libcharon libandroidbridge libstrongswan libipsec; do
            unzip -l crates/bamdad-app/android/app/build/outputs/apk/x86_64/debug/app-x86_64-debug.apk \
              | grep -q "lib/x86_64/$lib.so" || { echo "missing $lib.so in the APK"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bamdad-android-debug
          path: crates/bamdad-app/android/app/build/outputs/apk/x86_64/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: bamdad-netcheck-android
          path: netcheck/
          if-no-files-found: error

  strongswan:
    name: strongSwan Android libraries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check out strongSwan
        run: git submodule update --init --depth 1 crates/bamdad-app/android/vendor/strongswan
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential autoconf automake libtool gperf bison flex pkg-config
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.0.12077973"
      - name: Download OpenSSL sources
        run: |
          curl -sSL "https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz" \
            | tar -xz
      - name: Build charon for arm64-v8a and x86_64
        run: |
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.0.12077973" \
          OPENSSL_SRC="$PWD/openssl-3.5.4" \
            ./scripts/build-strongswan-android.sh arm64-v8a x86_64
      - name: Inspect the libraries
        run: |
          find build/strongswan-android -maxdepth 2 -name '*.so' | sort
      - uses: actions/upload-artifact@v7
        with:
          name: bamdad-strongswan-android
          path: |
            build/strongswan-android/arm64-v8a/
            build/strongswan-android/x86_64/

  tun-helper:
    name: Desktop TUN helper (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: tun-helper
      - name: Build the helper
        run: cargo build -p bamdad-tun-helper
      - name: Exercise it in a throwaway network namespace
        run: bash scripts/test-tun-helper.sh

  desktop-tunnel:
    name: Desktop tunnel end-to-end (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: desktop-tunnel
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Build the privileged helper
        run: cargo build -p bamdad-tun-helper
      - name: Build the tun2socks sidecar
        run: bash scripts/fetch-desktop-tun2socks.sh target/debug
      - name: Install sing-box for the fake internet
        run: |
          XDG_DATA_HOME="$PWD/.ci-data" bash scripts/fetch-singbox.sh
          test -x "$PWD/.ci-data/bamdad/bin/sing-box"
      - name: Run the tunnel end to end in a network namespace
        run: |
          SINGBOX="$PWD/.ci-data/bamdad/bin/sing-box" \
            bash scripts/test-desktop-tunnel.sh

  macos-tun-helper:
    name: Desktop TUN helper (macos-aarch64)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: tun-helper-macos
      - name: Build the helper
        run: cargo build -p bamdad-tun-helper
      - name: Exercise utun and routing
        run: bash scripts/test-macos-tun-helper.sh
