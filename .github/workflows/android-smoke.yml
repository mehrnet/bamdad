          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"
          find netcheck -type f -print
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run kill-switch lifecycle
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/android-killswitch-smoke.sh
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-killswitch-smoke
          path: |
            /tmp/bamdad-killswitch-smoke/*
          if-no-files-found: warn

  ipsec:
    name: IPSec libraries smoke on emulator
    runs-on: ubuntu-latest
    if: inputs.job == 'all' || inputs.job == 'ipsec'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-android-debug
          path: apk
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Download the Android network checker
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-netcheck-android
          path: netcheck
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Locate APK
        run: |
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"
          unzip -l "$GITHUB_WORKSPACE/app-debug.apk" | grep 'lib/x86_64/lib' | sort
          find netcheck -type f -print
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the IPSec test server
        run: bash scripts/ipsec-test-server.sh
      - name: Run the IPSec tunnel
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/android-ipsec-smoke.sh
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ipsec-smoke
          path: |
            /tmp/bamdad-ipsec-smoke/*
          if-no-files-found: warn
      - name: Stop the IPSec test server
        if: always()
        run: |
          sudo swanctl --list-sas || true
          sudo pkill -f '/usr/lib/ipsec/charon' || true
