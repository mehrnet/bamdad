name: Android smoke

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which smoke to run: all, emulator, wireguard, openvpn, openvpn-fail, no-failover, amneziawg, killswitch, ipsec"
        type: string
        default: all

permissions:
  contents: read
  actions: read

jobs:
  emulator:
    name: Launch + VPN smoke on emulator
    runs-on: ubuntu-latest
    if: inputs.job == 'all' || inputs.job == 'emulator'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-android-debug
          path: apk
          search_artifacts: true
          workflow_conclusion: success
          branch: main

      - name: Download the Android network checker
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-netcheck-android
          path: netcheck
          search_artifacts: true
          workflow_conclusion: success
          branch: main

      - name: Locate APK
        run: |
          find apk -type f -name '*.apk' -print
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"
          find netcheck -type f -print

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app, connect, accept VPN consent
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/android-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-vpn-smoke
          path: |
            /tmp/bamdad-smoke/*
          if-no-files-found: warn

  wireguard:
    name: Native WireGuard smoke on emulator
    runs-on: ubuntu-latest
    if: inputs.job == 'all' || inputs.job == 'wireguard'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-android-debug
          path: apk
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Download the Android network checker
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-netcheck-android
          path: netcheck
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Locate APK
        run: |
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"
          find netcheck -type f -print
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start WireGuard test server
        run: bash scripts/wireguard-test-server.sh
      - name: Run native WireGuard tunnel
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/android-wireguard-smoke.sh
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-wireguard-smoke
          path: |
            /tmp/bamdad-wg-smoke/*
          if-no-files-found: warn
      - name: Stop WireGuard test server
        if: always()
        run: sudo wg-quick down wg0 || true

  openvpn:
    name: Native OpenVPN smoke on emulator
    runs-on: ubuntu-latest
    if: inputs.job == 'all' || inputs.job == 'openvpn'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-android-debug
          path: apk
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Locate APK
        run: |
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start OpenVPN test server
        run: bash scripts/openvpn-test-server.sh
      - name: Run native OpenVPN tunnel
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/android-openvpn-smoke.sh
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-openvpn-smoke
          path: |
            /tmp/bamdad-ovpn-smoke/*
          if-no-files-found: warn
      - name: Stop OpenVPN test server
        if: always()
        run: |
          sudo kill "$(sudo cat /tmp/bamdad-ovpn/server.pid)" 2>/dev/null || true
          sudo cat /tmp/bamdad-ovpn/server.log || true


  openvpn-fail:
    name: OpenVPN failure smoke on emulator
    runs-on: ubuntu-latest
    if: inputs.job == 'all' || inputs.job == 'openvpn-fail'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-android-debug
          path: apk
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Locate APK
        run: |
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The PKI/client profile comes from the same generator as the happy-path
      # smoke; the failure test rewrites its remote to a closed port.
      - name: Generate the OpenVPN test profile
        run: bash scripts/openvpn-test-server.sh
      - name: Run the refused-server scenario
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/android-openvpn-failure-smoke.sh
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-openvpn-failure-smoke
          path: |
            /tmp/bamdad-ovpn-fail/*
          if-no-files-found: warn


  no-failover:
    name: No-failover on local failure smoke
    runs-on: ubuntu-latest
    if: inputs.job == 'all' || inputs.job == 'no-failover'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-android-debug
          path: apk
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Locate APK
        run: |
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Deny the VPN permission with auto-switch enabled
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/android-no-failover-smoke.sh
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-no-failover-smoke
          path: |
            /tmp/bamdad-no-failover/*
          if-no-files-found: warn

  amneziawg:
    name: Native AmneziaWG smoke on emulator
    runs-on: ubuntu-latest
    if: inputs.job == 'all' || inputs.job == 'amneziawg'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-android-debug
          path: apk
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Download the Android network checker
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-netcheck-android
          path: netcheck
          search_artifacts: true
          workflow_conclusion: success
          branch: main
      - name: Locate APK
        run: |
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start AmneziaWG test server
        run: bash scripts/amneziawg-test-server.sh
      - name: Run native AmneziaWG tunnel
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/android-amneziawg-smoke.sh
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-amneziawg-smoke
          path: |
            /tmp/bamdad-awg-smoke/*
          if-no-files-found: warn
      - name: Stop AmneziaWG test server
        if: always()
        run: |
          sudo env "PATH=/tmp/bamdad-awg/bin:$PATH" \
            WG_QUICK_USERSPACE_IMPLEMENTATION=amneziawg-go \
            awg-quick down /tmp/bamdad-awg/awg0.conf || true

  killswitch:
    name: Kill-switch smoke on emulator
    runs-on: ubuntu-latest
    if: inputs.job == 'all' || inputs.job == 'killswitch'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: native.yml
          name: bamdad-android-debug
