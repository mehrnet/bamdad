name: Android smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulator:
    name: Launch + VPN smoke on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download the x86_64 debug APK
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: native.yml
          name: bamdad-android-debug
          path: apk
          search_artifacts: true
          workflow_conclusion: success
          branch: main

      - name: Locate APK
        run: |
          find apk -type f -name '*.apk' -print
          APK=$(find apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app, connect, accept VPN consent
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            set -x
            OUT="$GITHUB_WORKSPACE"
            APK="$OUT/app-debug.apk"
            test -f "$APK"
            adb install -r "$APK"
            adb shell pm grant com.mehrnet.bamdad android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -W -n com.mehrnet.bamdad/.MainActivity
            sleep 6
            adb exec-out screencap -p > "$OUT/before.png"

            SIZE=$(adb shell wm size | tr -d '\r' | awk -F' ' '{print $NF}')
            W=$(echo "$SIZE" | cut -dx -f1)
            H=$(echo "$SIZE" | cut -dx -f2)
            adb shell input tap $((W / 2)) $((H - 180))
            sleep 4
            adb exec-out screencap -p > "$OUT/connect-tap.png"

            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml "$OUT/window.xml" || true
            python3 scripts/android-consent.py "$OUT/window.xml"

            sleep 6
            adb exec-out screencap -p > "$OUT/after.png"
            echo '--- interfaces ---'
            adb shell ip addr show tun0 || true
            echo '--- connectivity ---'
            adb shell dumpsys connectivity | grep -i -A2 -B2 vpn || true
            adb logcat -d -v threadtime > "$OUT/full-logcat.txt"
            echo '--- vpn log ---'
            grep -Ei 'BamdadVpn|hev-socks|VpnService|FATAL EXCEPTION|AndroidRuntime' "$OUT/full-logcat.txt" || true
            test -n "$(adb shell pidof com.mehrnet.bamdad | tr -d '\r')"
            ! grep -q 'FATAL EXCEPTION' "$OUT/full-logcat.txt"
            grep -q 'VPN tunnel started' "$OUT/full-logcat.txt"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-vpn-smoke
          path: |
            before.png
            connect-tap.png
            after.png
            full-logcat.txt
            window.xml
          if-no-files-found: warn
